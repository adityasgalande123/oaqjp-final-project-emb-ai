<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emotion Detection</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 48px auto; padding: 0 18px; color: #222; }
    h1 { margin-bottom: 8px; }
    textarea { width: 100%; min-height: 110px; padding: 12px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 10px 18px; cursor: pointer; }
    #result { margin-top: 22px; padding: 16px; border: 1px solid #ddd; border-radius: 8px; white-space: pre-wrap; }
    .error { color: #a11; }
  </style>
</head>
<body>
  <h1>Emotion Detection</h1>
  <p>Enter a sentence to identify its dominant emotion.</p>
  <form id="emotion-form">
    <label for="textToAnalyze">Text to analyze</label>
    <textarea id="textToAnalyze" name="textToAnalyze"
      placeholder="Example: I am really mad about this"></textarea>
    <button type="submit">Analyze emotion</button>
  </form>
  <div id="result" aria-live="polite">Your result will appear here.</div>
  <script>
    const form = document.getElementById("emotion-form");
    const input = document.getElementById("textToAnalyze");
    const output = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      output.className = "";
      const text = input.value;
      if (!text.trim()) {
        output.className = "error";
        output.textContent = "Please enter some text to analyze.";
        return;
      }
      output.textContent = "Analyzing...";
      try {
        const response = await fetch("/emotionDetector", {
          method: "POST",
          headers: {"Content-Type": "application/x-www-form-urlencoded"},
          body: new URLSearchParams({textToAnalyze: text})
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Unable to analyze this text.");
        }
        output.textContent =
          "Input: " + data.text + "\n\n" +
          "anger: " + data.emotions.anger + "\n" +
          "disgust: " + data.emotions.disgust + "\n" +
          "fear: " + data.emotions.fear + "\n" +
          "joy: " + data.emotions.joy + "\n" +
          "sadness: " + data.emotions.sadness + "\n\n" +
          "Dominant emotion: " + data.dominant_emotion;
      } catch (error) {
        output.className = "error";
        output.textContent = error.message;
      }
    });
  </script>
</body>
</html>
